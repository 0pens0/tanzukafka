---
applications:
  - name: tanzukafka-ui
    path: ../web-ui/target/web-ui-1.0.jar
    memory: 1G
    instances: 1
    random-route: true
    timeout: 180
    buildpacks:
      - java_buildpack_offline
    env:
      JBP_CONFIG_OPEN_JDK_JRE: "{ jre: { version: 11.+ } }"
    services:
      - ((kafka_service_name))

  - name: tanzukafka-lines
    path: ../lines-generator/target/lines-generator-1.0.jar
    memory: 1G
    instances: 1
    no-route: true
    buildpacks:
      - java_buildpack_offline
    env:
      JBP_CONFIG_OPEN_JDK_JRE: "{ jre: { version: 11.+ } }"
    services:
      - ((kafka_service_name))

  - name: tanzukafka-stream
    path: ../wordcount-stream/target/wordcount-stream-1.0.jar
    memory: 1G
    instances: 1
    no-route: true
    # Worker: Kafka Streams can block before :8080 binds; port checks crash the app.
    health-check-type: process
    timeout: 180
    buildpacks:
      - java_buildpack_offline
    env:
      JBP_CONFIG_OPEN_JDK_JRE: "{ jre: { version: 11.+ } }"
      # Fresh streams id avoids multi-million-msg repartition backlog that kills the thread.
      SPRING_APPLICATION_NAME: ((kafka_streams_app_id))
      SPRING_CLOUD_STREAM_KSTREAM_BINDER_CONFIGURATION_AUTO_OFFSET_RESET: latest
      SPRING_CLOUD_STREAM_KSTREAM_BINDER_CONFIGURATION_RETRIES: "10"
      SPRING_CLOUD_STREAM_KSTREAM_BINDER_CONFIGURATION_DELIVERY_TIMEOUT_MS: "120000"
    services:
      - ((kafka_service_name))

  - name: tanzukafka-kafka-ui
    lifecycle: docker
    docker:
      image: provectuslabs/kafka-ui:latest
    memory: 1G
    instances: 1
    random-route: true
    env:
      DYNAMIC_CONFIG_ENABLED: "false"
      KAFKA_CLUSTERS_0_NAME: ((kafka_ui_cluster_name))
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: ((kafka_bootstrap_servers))
      KAFKA_CLUSTERS_0_PROPERTIES_SECURITY_PROTOCOL: ((kafka_security_protocol))
      KAFKA_CLUSTERS_0_PROPERTIES_SASL_MECHANISM: ((kafka_sasl_mechanism))
      KAFKA_CLUSTERS_0_PROPERTIES_SASL_JAAS_CONFIG: ((kafka_sasl_jaas_config))
